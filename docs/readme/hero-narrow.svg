1;transform:none}97%,100%{opacity:0;transform:none}}.b4{animation:b4 12s cubic-bezier(.2,.7,.2,1) -9s infinite both}.b4{transform-box:fill-box;transform-origin:50% 100%}@keyframes b5{0%,58%{opacity:0;transform:scaleY(0)}63%,91%{opacity:1;transform:none}97%,100%{opacity:0;transform:none}}.b5{animation:b5 12s cubic-bezier(.2,.7,.2,1) -9s infinite both}.b5{transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
