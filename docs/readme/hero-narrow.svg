<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1190" viewBox="0 0 480 1190" role="img" aria-labelledby="t d">
<title id="t">Tickmark: every correction becomes a rule, every rule retires a model call</title><desc id="d">Animated illustration. A controller corrects how an Amazon Web Services invoice is coded in January and again in February; the two agreeing corrections compile into an active rule (vendor is Amazon Web Services, code 6820 split ENG 60, DATA 25, PROD 15) that runs with zero model calls. A bar chart shows measured model calls per close across 3 held-out companies, Jan 24, Feb 24, Mar 15, Apr 9, May 12, Jun 9. 0 of 677 lines cleared unattended were wrong.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#533afd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
