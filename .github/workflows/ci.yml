name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, eval, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Mechanism test (whole loop, deterministic stand-in)
        run: npm run selftest
      - name: Eval reproduces the committed results
        run: npm run eval -- --check
      - name: README graphics match their source data
        run: npm run readme:assets -- --check
      - name: Production build
        run: npm run build
      - name: Every route answers in the built app
        run: npm run smoke
